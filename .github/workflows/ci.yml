name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Carthage bootstrap
        run: carthage bootstrap --platform iOS --use-xcframeworks
      - name: Build and run tests
        run: >
          set -o pipefail &&
          xcodebuild -workspace JSONAPIModel.xcworkspace -scheme JSONAPIModel-iOS
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -configuration Debug test | xcbeautify
